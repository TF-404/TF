name: Daily P&L

on:
  schedule:
    # 00:05 Asia/Taipei (UTC+8), plus a refresh every six hours.
    - cron: "5 16 * * *"
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record daily P&L
        env:
          HL_SITE_DIR: ${{ github.workspace }}
          HL_PNL_REPO: ${{ github.workspace }}
          HL_PNL_NO_PUSH: "1"
        run: python3 scripts/daily_pnl.py

      - name: Commit and push if days changed
        run: |
          git add -- data/daily-pnl.json
          if git diff --cached --quiet -- data/daily-pnl.json; then
            echo "No change in daily P&L days; skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily P&L record"
          git push
